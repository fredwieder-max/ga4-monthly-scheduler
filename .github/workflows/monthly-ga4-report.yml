name: Monthly GA4 Report

on:
  schedule:
    # Le 1er de chaque mois à 6h00 UTC (8h00 en été, 7h00 en hiver, heure de Paris)
    # Format cron : minute heure jour mois jour-de-semaine
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  trigger-make-scenario:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Make.com webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"monthly-ga4-report"}' \
            https://hook.eu1.make.com/1il7c8g7w38ube8nsh7fbtige76fmk2s
