name: Monthly GA4 Report

on:
  schedule:
    # Le 1er de chaque mois à 6h00 UTC (8h00 en été, 7h00 en hiver, heure de Paris)
    # Format cron : minute heure jour mois jour-de-semaine
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  trigger-make-scenario:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Make.com webhook
        env:
          # URL du webhook rangée dans Settings > Secrets and variables > Actions
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "Le secret MAKE_WEBHOOK_URL est absent : ajoutez-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"monthly-ga4-report"}' \
            "$MAKE_WEBHOOK_URL"
