name: Monthly GA4 Report

on:
  schedule:
      # Runs at 8:00 AM UTC+2 (Paris time) on the 1st of every month
          # Cron format: minute hour day month day-of-week
              # 6 8 1 * * = 8:00 UTC (which is 10:00 CEST or 9:00 CET depending on DST)
                  - cron: '0 6 1 * *'
  workflow_dispatch:

                    jobs:
                      trigger-make-scenario:
                          runs-on: ubuntu-latest
                              steps:
                                    - name: Trigger Make.com webhook
                                            run: |
                                                      curl -X POST \
                                                                  -H "Content-Type: application/json" \
                                                                              -d '{{"trigger":"monthly-ga4-report"}' \
                                                                                  https://hook.eu1.make.com/1il7c8g7w38ube8nsh7fbtige76fmk2s
                                                                                      
